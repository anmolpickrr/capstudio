<!doctype html>
<!-- GitHub Pages entry (anmolpickrr.github.io/capstudio). Pages only hosts files and
     can't run the app's server, so this page shows the live site on Render inside a
     full-window frame; the address bar keeps the github.io address. While the server
     loads (or wakes up: Render's free plan can sleep when idle) it shows its own
     loading screen instead of Render's, until the app says it's ready. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capstudio</title>
  <link rel="icon" href="static/favicon.svg?v=2" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; color: #f4f4f5; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    iframe { display: block; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .4s; }
    iframe.ready { opacity: 1; }
    .loading {
      position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .4s;
      background: radial-gradient(520px 360px at 50% 42%, rgba(96, 55, 215, .22), transparent 70%),
                  radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.2px) 0 0 / 22px 22px, #050505;
    }
    .loading.done { opacity: 0; pointer-events: none; }
    .box { display: grid; justify-items: center; gap: 22px; text-align: center; padding: 24px; }
    .box img { width: 180px; height: auto; }
    .bar { width: 220px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; }
    .bar i { display: block; width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6037d7, #a08bff); animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    .msg { margin: 0; color: #a1a1aa; max-width: 34ch; }
    .msg small { display: block; margin-top: 6px; color: #6b6b74; }
    a { color: #a08bff; }
    @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="box">
      <img src="static/logo.svg" alt="Capstudio by Fastrr">
      <div class="bar" aria-hidden="true"><i></i></div>
      <p class="msg" id="msg" role="status" aria-label="Loading"></p>
    </div>
  </div>
  <script>
    const SITE = 'https://caption-studio-ujgd.onrender.com';
    const loading = document.getElementById('loading');
    const msg = document.getElementById('msg');
    const started = Date.now();
    let awake = false, wasAsleep = false, shown = false, staleFrame = false;

    function show() {
      if (shown) return;
      shown = true;
      frame.classList.add('ready');
      loading.classList.add('done');
    }

    // Start loading the app straight away, behind the logo. It says when it's drawn.
    const frame = document.createElement('iframe');
    frame.title = 'Capstudio';
    frame.allow = 'fullscreen; clipboard-write; autoplay';
    frame.src = SITE + '/';
    frame.onload = () => {
      if (!awake) staleFrame = true; // Render's "waking up" page, not the app
      else setTimeout(show, 6000);   // in case the app never says it's ready
    };
    document.body.append(frame);
    window.addEventListener('message', (e) => {
      if (e.origin === SITE && e.data === 'capstudio-ready') show();
    });

    // If the server was asleep, the frame got Render's waiting page: once the server
    // answers, load the app again.
    async function check() {
      try {
        const r = await fetch(SITE + '/api/health', { cache: 'no-store' });
        if (r.ok && (await r.json()).status === 'ok') {
          awake = true;
          if (staleFrame && wasAsleep && !shown) frame.src = SITE + '/';
          return;
        }
      } catch (e) { /* still waking */ }
      wasAsleep = true;
      if (Date.now() - started > 90000) msg.innerHTML = '<a href="' + SITE + '/">Open Capstudio directly</a>';
      setTimeout(check, 1500);
    }
    check();
  </script>
</body>
</html>
