name: Keep the site awake

# Render's free plan puts the site to sleep after 15 minutes without visitors,
# and the next visitor waits about a minute. A request every 10 minutes keeps it
# awake (one service running all month uses ~720 of the 750 free hours).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://caption-studio-ujgd.onrender.com/api/health
