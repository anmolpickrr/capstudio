name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests
      - run: node tests/editor_model.mjs

  # After the tests pass on main, ask Render to deploy this commit. Needs the
  # RENDER_DEPLOY_HOOK secret (Render → service → Settings → Deploy Hook).
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning title=Not deployed::Add the RENDER_DEPLOY_HOOK secret so pushes update the live site."
            exit 0
          fi
          # the hook already carries "?key=…", so the commit is added with "&"
          case "$HOOK" in *\?*) SEP="&" ;; *) SEP="?" ;; esac
          curl -fsS -X POST "${HOOK}${SEP}ref=${GITHUB_SHA}" > /dev/null
          echo "Render deploy started for ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
