<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caption Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="#/studio" aria-label="Caption Studio home">
        <span class="brand-mark" id="brand-mark"></span>
        <span>Caption Studio</span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#/studio" data-route="studio">Studio</a>
        <a href="#/demo" data-route="demo">Demo</a>
      </nav>
      <span class="header-spacer"></span>
      <span class="privacy-chip" id="privacy-chip"></span>
      <div class="user" id="user" hidden>
        <span class="avatar" id="user-avatar"></span>
        <span class="user-name" id="user-name"></span>
        <a class="btn ghost sm" href="/auth/logout">Sign out</a>
      </div>
    </header>
    <main id="view" class="studio"></main>
  </div>
  <dialog id="export-dialog"></dialog>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
