<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Caption Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/studio.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; overflow: auto;
      background: radial-gradient(1200px 600px at 15% 10%, rgba(108, 92, 255, .22), transparent 60%),
                  radial-gradient(900px 500px at 90% 90%, rgba(248, 120, 200, .12), transparent 60%), var(--bg-0); }
    .login { width: min(440px, 100%); background: var(--bg-1); border: 1px solid var(--line); border-radius: 18px;
      padding: 32px 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
    .login .brand { font-size: 18px; margin-bottom: 22px; }
    .login h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.01em; }
    .login p { color: var(--text-2); margin: 0 0 22px; }
    .sample { position: relative; height: 120px; border-radius: 12px; margin-bottom: 24px; overflow: hidden;
      background: linear-gradient(135deg, #1d2b64, #6c5cff 60%, #f8cdda); display: grid; place-items: end center; padding-bottom: 18px; }
    .sample span { font: 800 22px/1 Poppins, Inter, sans-serif; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; letter-spacing: .01em; }
    .sample span b { color: #ffe600; font-weight: 800; }
    .google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
      background: #fff; color: #1f1f1f; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 600;
      font-size: 15px; cursor: pointer; text-decoration: none; transition: transform .05s, box-shadow .15s; }
    .google:hover { box-shadow: 0 0 0 4px rgba(108, 92, 255, .35); }
    .google:active { transform: translateY(1px); }
    .note { font-size: 12.5px; color: var(--text-2); margin-top: 16px; text-align: center; }
    .alert { border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 18px;
      background: rgba(248, 113, 113, .1); border: 1px solid rgba(248, 113, 113, .35); color: #fca5a5; }
    .alert.info { background: rgba(108, 92, 255, .12); border-color: rgba(108, 92, 255, .4); color: #c7c0ff; }
    .alert a { color: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" style="width:16px;height:16px"><path d="M4 7h16M4 12h10M4 17h7"/><path d="m15 15 5 3-5 3z" fill="#fff"/></svg></span> Caption Studio</div>
    <div class="sample"><span>Make every <b>video</b> count</span></div>
    <h1>Sign in to continue</h1>
    <p>Upload a finished video, get accurate synced captions, style them and download — in minutes.</p>
    <div class="alert info" id="frame-note" hidden>
      Sign-in can't run inside this embedded view.
      <a id="open-full" target="_blank" rel="noopener">Open Caption Studio in a new tab →</a>
    </div>
    <div class="alert" id="error" hidden></div>
    <a class="google" id="google" href="/auth/login">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </a>
    <div class="note" id="domains"></div>
  </main>
  <script>
    const ERRORS = {
      not_allowed: 'That Google account isn’t allowed. Please sign in with your company email.',
      cancelled: 'Sign-in was cancelled.',
      expired: 'The sign-in link expired. Please try again.',
      google_error: 'Google sign-in didn’t complete. Please try again in a moment.',
      not_configured: 'Sign-in isn’t set up yet. Ask your administrator to finish the Google setup.',
    };
    const err = new URLSearchParams(location.search).get('error');
    if (err && ERRORS[err]) {
      const box = document.getElementById('error');
      box.textContent = ERRORS[err];
      box.hidden = false;
    }
    if (window.top !== window.self) {
      document.getElementById('frame-note').hidden = false;
      document.getElementById('open-full').href = location.origin + '/';
      document.getElementById('google').href = location.origin + '/';
      document.getElementById('google').target = '_blank';
    }
    fetch('/auth/status').then((r) => r.json()).then((s) => {
      if (s.domains.length) {
        document.getElementById('domains').textContent =
          `Use your ${s.domains.map((d) => '@' + d).join(' or ')} Google account.`;
      }
      if (!s.configured && !err) {
        const box = document.getElementById('error');
        box.textContent = ERRORS.not_configured;
        box.hidden = false;
      }
    }).catch(() => {});
  </script>
</body>
</html>
